name: Сборка для Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app.py", "forever_deals/**", "tests/**", ".github/workflows/build-windows.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Сборка exe
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          Set-Content -Path VERSION -Value "${{ github.sha }}" -Encoding ascii
          python -m PyInstaller --noconsole --onefile --name ForeverDeals --add-data "VERSION;." --add-data "forever_deals/mobile;forever_deals/mobile" app.py
      - name: Проверка exe в демо-режиме (без окна)
        run: |
          $env:FD_HOME = "$PWD\smoke_home"
          $p = Start-Process dist\ForeverDeals.exe -ArgumentList "--demo","--run-once" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Get-ChildItem "$env:FD_HOME\reports\*.html")) { exit 1 }
      - name: Упаковка
        run: |
          Copy-Item README.md, vendors_template.csv, schedule_windows.bat dist\
          Compress-Archive -Path dist\* -DestinationPath ForeverDeals-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverDeals-windows
          path: ForeverDeals-windows.zip
      - name: Публикация в Releases (тег windows-latest, перезаписывается)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --cleanup-tag --yes
          $global:LASTEXITCODE = 0
          gh release create windows-latest ForeverDeals-windows.zip --target ${{ github.sha }} `
            --title "Сборка для Windows (последний main)" `
            --notes "ForeverDeals.exe собран из коммита ${{ github.sha }}. Тесты и запуск exe в демо-режиме пройдены на Windows."
